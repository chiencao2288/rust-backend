<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Password Reset Code</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
        .card { max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .header { text-align: center; margin-bottom: 24px; }
        .code-box { background: #fff1f2; border: 1px dashed #e11d48; border-radius: 6px; padding: 16px; text-align: center; margin: 24px 0; }
        .code { font-size: 32px; font-weight: bold; letter-spacing: 6px; color: #e11d48; }
        .footer { font-size: 13px; color: #6b7280; text-align: center; margin-top: 24px; border-top: 1px solid #e5e7eb; padding-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>{{app_name}}</h2>
            <p>You requested a password reset for your account.</p>
        </div>
        <div class="code-box">
            <div class="code">{{otp}}</div>
        </div>
        <p>This code will expire in <strong>{{ttl_min}} minutes</strong>.</p>
        <div class="footer">
            <p>If you did not request a password reset, your account is still secure and you can safely ignore this email.</p>
        </div>
    </div>
</body>
</html>
