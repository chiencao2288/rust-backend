[package]
name = "rn-rabbitmq"
version = "0.1.0"
edition = "2021"
description = "High-performance cluster-ready RabbitMQ client library"

[dependencies]
lapin = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["time", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "macros", "rt-multi-thread"] }
