[package]
name = "rn-bootstrap"
version = "0.1.0"
edition = "2021"
description = "Service bootstrap with config loading, tracing, panic hook, and HTTP server"

[dependencies]
rn-macros = { path = "../rn-macros", features = ["bootstrap", "error"] }

axum = "0.8"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
