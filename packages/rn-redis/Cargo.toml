[package]
name = "rn-redis"
version = "0.1.0"
edition = "2021"
description = "High-performance cluster-native Redis client library"

[dependencies]
fred = { version = "10.1.0", features = ["i-scripts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["time", "sync"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "macros", "rt-multi-thread"] }
